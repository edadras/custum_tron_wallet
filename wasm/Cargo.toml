[package]
name = "tron_vanity_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
sha3 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
